<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <title>Octo Core</title>
    <style>
      html,
      body {
        margin: 0;
        width: 1200px;
        height: 630px;
        background: #000;
        color: #fafafa;
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", sans-serif;
      }
      .wrap {
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 24px;
        height: 100%;
        padding: 0 96px;
        background: radial-gradient(70% 90% at 80% 10%, rgba(201, 166, 245, 0.28), transparent 60%);
      }
      .title {
        display: flex;
        align-items: center;
        gap: 22px;
        font-size: 96px;
        font-weight: 500;
        letter-spacing: -0.03em;
      }
      .title img {
        width: 104px;
        height: 104px;
        border-radius: 24px;
      }
      .sub {
        max-width: 900px;
        font-size: 38px;
        color: #a1a1aa;
      }
      .note {
        font-size: 24px;
        color: #c9a6f5;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="title">Ecco <img src="assets/logo-256.png" alt="" /> Octo</div>
      <div class="sub">Dal lavoro osservato a un processo documentato. Prima di automatizzare.</div>
      <div class="note">
        Gratis per macOS, Windows e Linux · open source GPL-3.0 · firmato e notarizzato
      </div>
    </div>
  </body>
</html>
